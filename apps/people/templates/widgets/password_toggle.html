<div class="input-group">
    <input
        type="{{ widget.type }}"
        name="{{ widget.name }}"
        {% if widget.value != None %}
            value="{{ widget.value }}"
        {% endif %}
        {% include "django/forms/widgets/attrs.html" %}
    >

    <button
        type="button"
        class="btn btn-outline-secondary password-toggle"
        tabindex="-1"
        title="Show password"
    >
        <i class="bi bi-eye"></i>
    </button>
</div>
