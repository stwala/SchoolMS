{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="d-flex align-items-center gap-3 mb-3">
      <a href="javascript:history.back();" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Back
      </a>
      <h5 class="fw-bold mb-0 text-dark">{{ title }}</h5>
    </div>
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        {% crispy form %}
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<style>
  /* Force the raw, original multiple select list to stay hidden */
  select.select2-students {
    display: none !important;
  }

  /* Match the styling and padding of Bootstrap 5 inputs */
  .select2-container--bootstrap-5 .select2-selection {
    border: 1px solid #dee2e6 !important;
    border-radius: 0.375rem !important;
    padding: 0.375rem 0.75rem !important;
    min-height: 48px !important; /* Matches your other form input heights */
    background-color: #fff !important;
  }

  /* Style the choice tags inside the multi-select so they look like clean badges */
  .select2-container--bootstrap-5 .select2-selection--multiple .select2-selection__choice {
    background-color: #eff6ff !important;
    border: 1px solid #bfdbfe !important;
    color: #1e40af !important;
    border-radius: 0.25rem !important;
    padding: 2px 8px !important;
    font-size: 0.9rem !important;
  }

  .select2-container--bootstrap-5 .select2-selection--multiple .select2-selection__choice__remove {
    color: #1e40af !important;
    margin-right: 5px !important;
  }
  
  .select2-container--bootstrap-5 .select2-selection--multiple .select2-selection__choice__remove:hover {
    background-color: #dbeafe !important;
    color: #111827 !important;
  }
</style>
<script>
$(document).ready(function () {
  // Only init if the field exists on this form (teachers only, not students)
  if ($('.select2-classes').length) {
    $('.select2-classes').select2({
      theme: 'bootstrap-5',
      placeholder: 'Select class(es)…',
      allowClear: true,
      width: '100%',
    });
  }

  if ($('.select2-students').length) {
    $('.select2-students').select2({
      theme: 'bootstrap-5',
      placeholder: 'Search by student name or admission no…',
      allowClear: true,
      width: '100%',
      minimumInputLength: 1,
      ajax: {
        url: "{% url 'people:student_search_ajax' %}",
        dataType: 'json',
        delay: 250,
        data: function (params) {
          return {
            q: params.term
          };
        },
        processResults: function (data) {
          return {
            results: data.results
          };
        },
        cache: true
      }
    });
  }
});
</script>
{% endblock %}
