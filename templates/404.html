{% extends 'base.html' %}
{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="min-vh-75 d-flex align-items-center justify-content-center py-5">
  <div class="text-center p-5 card border-0 shadow-lg" style="max-width: 520px; border-radius: 20px;">
    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary mb-4"
         style="width: 84px; height: 84px;">
      <i class="bi bi-compass fs-1"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark mb-2">404</h1>
    <h4 class="fw-bold text-dark mb-3">Page Not Found</h4>
    <p class="text-muted mb-4">
      The page you were looking for doesn't exist, was moved, or is temporarily unavailable.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="/" class="btn btn-primary px-4 py-2">
        <i class="bi bi-house me-1"></i> Back to Dashboard
      </a>
      <button onclick="window.history.back()" class="btn btn-outline-secondary px-4 py-2">
        <i class="bi bi-arrow-left me-1"></i> Go Back
      </button>
    </div>
  </div>
</div>
{% endblock %}
