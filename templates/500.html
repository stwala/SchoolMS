{% extends 'base.html' %}
{% block title %}500 — Server Error{% endblock %}

{% block content %}
<div class="min-vh-75 d-flex align-items-center justify-content-center py-5">
  <div class="text-center p-5 card border-0 shadow-lg" style="max-width: 520px; border-radius: 20px;">
    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger-subtle text-danger mb-4"
         style="width: 84px; height: 84px;">
      <i class="bi bi-exclamation-triangle fs-1"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark mb-2">500</h1>
    <h4 class="fw-bold text-dark mb-3">Unexpected Server Error</h4>
    <p class="text-muted mb-4">
      An error occurred while processing your request. The system administrator has been notified.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="/" class="btn btn-primary px-4 py-2">
        <i class="bi bi-house me-1"></i> Return to Dashboard
      </a>
      <a href="javascript:location.reload()" class="btn btn-outline-secondary px-4 py-2">
        <i class="bi bi-arrow-clockwise me-1"></i> Refresh Page
      </a>
    </div>
  </div>
</div>
{% endblock %}
