{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white border-0 pt-4 pb-0">
        <h5 class="card-title fw-bold text-dark mb-0">{{ title }}</h5>
      </div>
      <div class="card-body">
        {% crispy form %}
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
  const studentField = $('#id_student');
  const classField = $('#id_student_class');
  const balanceField = $('#id_balance_from_previous_term');

  if (studentField.length) {
    studentField.on('change', function() {
      const studentId = $(this).val();
      if (!studentId) {
        classField.val('');
        balanceField.val('0.00');
        return;
      }

      $.getJSON(`/finance/students/${studentId}/billing-info/`, function(data) {
        if (data.class_id) {
          classField.val(data.class_id);
        } else {
          classField.val('');
        }
        if (data.previous_balance) {
          balanceField.val(data.previous_balance);
        } else {
          balanceField.val('0.00');
        }
      });
    });
  }
});
</script>
{% endblock %}
